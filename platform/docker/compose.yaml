services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmart-postgres
    environment:
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmart -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4-alpine
    container_name: cloudmart-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
