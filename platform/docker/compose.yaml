services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudmart-postgres
    environment:
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: cloudmart
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmart -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-alpine
    container_name: cloudmart-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    container_name: cloudmart-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cloudmart-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cloudmart-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: cloudmart-kafka-init
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cloudmart-kafka:29092 --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cloudmart-kafka:29092 --create --if-not-exists --topic inventory --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server cloudmart-kafka:29092 --create --if-not-exists --topic payments --partitions 3 --replication-factor 1
    restart: "no"

  catalog-service:
    build: { context: ../.., dockerfile: services/catalog-service/Dockerfile }
    image: cloudmart/catalog-service:local
    container_name: cloudmart-catalog-service
    environment:
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://cloudmart:cloudmart@postgres:5432/catalog_db?sslmode=disable
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: &go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  cart-service:
    build: { context: ../.., dockerfile: services/cart-service/Dockerfile }
    image: cloudmart/cart-service:local
    container_name: cloudmart-cart-service
    environment:
      HTTP_ADDR: :8082
      REDIS_ADDR: redis:6379
    ports: ["8082:8082"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]

  order-service:
    build: { context: ../.., dockerfile: services/order-service/Dockerfile }
    image: cloudmart/order-service:local
    container_name: cloudmart-order-service
    environment:
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://cloudmart:cloudmart@postgres:5432/orders_db?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      ORDERS_TOPIC: orders
      PAYMENTS_TOPIC: payments
      PAYMENTS_CONSUMER_GROUP: order-service-payments
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]

  inventory-service:
    build: { context: ../.., dockerfile: services/inventory-service/Dockerfile }
    image: cloudmart/inventory-service:local
    container_name: cloudmart-inventory-service
    environment:
      HTTP_ADDR: :8084
      DATABASE_URL: postgres://cloudmart:cloudmart@postgres:5432/inventory_db?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      ORDERS_TOPIC: orders
      INVENTORY_TOPIC: inventory
      KAFKA_CONSUMER_GROUP: inventory-service
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]

  payment-service:
    build: { context: ../.., dockerfile: services/payment-service/Dockerfile }
    image: cloudmart/payment-service:local
    container_name: cloudmart-payment-service
    environment:
      HTTP_ADDR: :8085
      DATABASE_URL: postgres://cloudmart:cloudmart@postgres:5432/payments_db?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      INVENTORY_TOPIC: inventory
      PAYMENTS_TOPIC: payments
      KAFKA_CONSUMER_GROUP: payment-service
      PAYMENT_MAX_AUTH_CENTS: "500000"
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/healthz"]

  notification-service:
    build: { context: ../.., dockerfile: services/notification-service/Dockerfile }
    image: cloudmart/notification-service:local
    container_name: cloudmart-notification-service
    environment:
      HTTP_ADDR: :8086
      DATABASE_URL: postgres://cloudmart:cloudmart@postgres:5432/notifications_db?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      ORDERS_TOPIC: orders
      KAFKA_CONSUMER_GROUP: notification-service-v1
    ports: ["8086:8086"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/healthz"]

  web-bff:
    build: { context: ../.., dockerfile: services/web-bff/Dockerfile }
    image: cloudmart/web-bff:local
    container_name: cloudmart-web-bff
    environment:
      HTTP_ADDR: :8080
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CART_SERVICE_URL: http://cart-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      ALLOWED_ORIGIN: http://localhost:4200
    ports: ["8080:8080"]
    depends_on:
      catalog-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    healthcheck:
      <<: *go-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]

  storefront:
    build: { context: ../.., dockerfile: apps/storefront/Dockerfile }
    image: cloudmart/storefront:local
    container_name: cloudmart-storefront
    ports: ["4200:80"]
    depends_on:
      web-bff: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
